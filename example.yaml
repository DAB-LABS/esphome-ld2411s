substitutions:
  name: "ld2411s-presence"
  friendly_name: "LD2411S Presence"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32dev  # Change to match your board (e.g. nodemcu-32s, esp32-c3-devkitm-1)
  variant: esp32
  framework:
    type: esp-idf  # Recommended: better FreeRTOS integration, reliable WiFi stack, stricter watchdog

external_components:
  - source: github://DAB-LABS/esphome-ld2411s
    components: [ld2411s]

# WiFi — fill in your credentials or use !secret
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key  # Generate one at https://esphome.io/components/api.html

ota:
  - platform: esphome
    password: !secret ota_password   # Or remove password: line entirely for no OTA auth

# ─── UART ────────────────────────────────────────────────────────────────────
# TXD (green) → GPIO16 (RX)
# RXD (blue)  → GPIO17 (TX)
# VIN (red)   → ESP32 VIN (5V — not 3.3V)
# GND (black) → GND
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# ─── LD2411S COMPONENT ───────────────────────────────────────────────────────
ld2411s:
  uart_id: uart_bus

  distance:
    name: "Target Distance"
    unit_of_measurement: cm

  presence:
    name: "Presence"
    device_class: occupancy
    filters:
      - delayed_off: 10s   # Prevents flickering when person leaves

  motion:
    name: "Motion"
    device_class: motion
    filters:
      - delayed_off: 5s

# ─── RUNTIME ZONE CONTROLS ───────────────────────────────────────────────────
# Adjust detection zones from HA without reflashing.
#
# HOW IT WORKS:
# - Slider release commits the value to the HA entity (visible in HA activity log)
#   but does NOT yet send a command to the radar.
# - Press "Apply Settings" once after adjusting all values to push the full
#   configuration to the radar in a single command.
#
# WARNING — RADAR LOCK-UP:
# Rapid or repeated zone changes can cause the radar to stop responding.
# Symptoms: sensors freeze at last known state, or Presence/Motion/Distance
# go unavailable while other ESP sensors remain online.
# Fix: press "Reboot Radar". ESPHome restart alone will NOT fix this.
# Best practice: set all values, press Apply once, then leave it.
#
# Minimum hardware value: 30 cm.
number:
  - platform: template
    name: "Motion Zone Min"
    id: motion_zone_min
    min_value: 30
    max_value: 800
    step: 10
    initial_value: 30
    unit_of_measurement: cm
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:radar

  - platform: template
    name: "Motion Zone Max"
    id: motion_zone_max
    min_value: 30
    max_value: 800
    step: 10
    initial_value: 300
    unit_of_measurement: cm
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:radar

  - platform: template
    name: "Presence Zone Min"
    id: presence_zone_min
    min_value: 30
    max_value: 800
    step: 10
    initial_value: 30
    unit_of_measurement: cm
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:radar

  - platform: template
    name: "Presence Zone Max"
    id: presence_zone_max
    min_value: 30
    max_value: 800
    step: 10
    initial_value: 300
    unit_of_measurement: cm
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:radar

  - platform: template
    name: "Unoccupied Timeout"
    id: unoccupied_timeout
    min_value: 0
    max_value: 6553
    step: 1
    initial_value: 10
    unit_of_measurement: s
    mode: box
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:timer-outline

# ─── SWITCHES ────────────────────────────────────────────────────────────────
# Radar Bluetooth toggle.
#
# The LD2411S has onboard BLE (used by the HLKRadarTool app for configuration).
# This switch lets you enable or disable it from HA without the app.
#
# Toggling BT requires a radar reboot to take effect — sensors will be
# unavailable for a few seconds while it restarts. This is expected.
#
# The switch is optimistic (no read-back over UART) and defaults to OFF —
# the LD2411S ships with Bluetooth disabled from the factory.
#
# SEQUENCE: Enter config → set BT → End config (commits to radar flash)
#           → re-enter config → Reboot (reboot only fires inside config mode)
# End config MUST precede the reboot, otherwise the setting is lost on restart.
switch:
  - platform: template
    name: "Radar Bluetooth"
    id: radar_bluetooth
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:bluetooth
    turn_on_action:
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Enable config
      - delay: 100ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xA4, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # BT on
      - delay: 200ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # End config (commits to flash)
      - delay: 200ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Re-enter config
      - delay: 100ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA3, 0x00, 0x04, 0x03, 0x02, 0x01]              # Reboot radar
    turn_off_action:
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Enable config
      - delay: 100ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xA4, 0x00, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]  # BT off
      - delay: 200ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # End config (commits to flash)
      - delay: 200ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Re-enter config
      - delay: 100ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA3, 0x00, 0x04, 0x03, 0x02, 0x01]              # Reboot radar

# ─── BUTTONS ─────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Apply Settings"
    icon: mdi:content-save
    on_press:
      - script.execute: send_config

  - platform: template
    name: "Reboot Radar"
    icon: mdi:restart
    entity_category: diagnostic
    on_press:
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Enable config
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA3, 0x00, 0x04, 0x03, 0x02, 0x01]              # Reboot
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # End config

  - platform: template
    name: "Factory Reset Radar"
    icon: mdi:restore
    entity_category: diagnostic
    on_press:
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Enable config
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xA2, 0x00, 0x04, 0x03, 0x02, 0x01]              # Factory reset
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # End config

  - platform: restart
    name: "Restart"
    icon: mdi:restart
    entity_category: diagnostic

# ─── APPLY SETTINGS SCRIPT ───────────────────────────────────────────────────
# Reads current slider values and sends a single Set Parameter command (0x0067)
# to the radar. Unoccupied timeout is stored in seconds but sent as 100ms units
# (multiply by 10) per the LD2411S UART protocol spec.
script:
  - id: send_config
    then:
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # Enable config
      - uart.write:
          id: uart_bus
          data: !lambda |-
            int minmot  = (int)id(motion_zone_min).state;
            int maxmot  = (int)id(motion_zone_max).state;
            int minpr   = (int)id(presence_zone_min).state;
            int maxpr   = (int)id(presence_zone_max).state;
            uint16_t unocc = (uint16_t)(id(unoccupied_timeout).state * 10);
            return std::vector<uint8_t>{
              0xFD,0xFC,0xFB,0xFA, 0x20,0x00, 0x67,0x00,
              0x00,0x00, (uint8_t)(maxmot & 0xFF), (uint8_t)(maxmot >> 8), 0x00,0x00,
              0x01,0x00, (uint8_t)(minmot & 0xFF), (uint8_t)(minmot >> 8), 0x00,0x00,
              0x02,0x00, (uint8_t)(maxpr  & 0xFF), (uint8_t)(maxpr  >> 8), 0x00,0x00,
              0x03,0x00, (uint8_t)(minpr  & 0xFF), (uint8_t)(minpr  >> 8), 0x00,0x00,
              0x04,0x00, (uint8_t)(unocc  & 0xFF), (uint8_t)(unocc  >> 8), 0x00,0x00,
              0x04,0x03,0x02,0x01
            };
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]  # End config

# ─── CRASH DIAGNOSTICS ───────────────────────────────────────────────────────
# Exposes reset reason and heap health as HA entities.
# If you see "Reset Reason: power-on event" repeating, check your power supply.
# Combined peak draw from the ESP32 and LD2411S can reach several hundred mA —
# enough to cause voltage sag on a marginal supply. Try a 2A supply if unstable.
# See README for full Reset Reason reference table.
debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic
    bssid:
      name: "BSSID"
      entity_category: diagnostic

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
