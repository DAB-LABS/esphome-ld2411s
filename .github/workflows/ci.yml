name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate YAML config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.9.1

      - name: Write secrets stub
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "test_network"
          wifi_password: "test_password"
          api_encryption_key: "Qx1FBLKZeHq6kDBVdmh1/N94LJoyvFhYr4YqX4I8vPc="
          ota_password: "testpassword"
          EOF

      - name: Build against this checkout
        run: |
          sed -E 's#source: github://DAB-LABS/esphome-ld2411s.*#source: components#' example.yaml > ci.yaml
          grep -n 'source:' ci.yaml

      - name: Validate config
        run: esphome config ci.yaml

  compile:
    name: Compile example.yaml
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.9.1

      - name: Write secrets stub
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "test_network"
          wifi_password: "test_password"
          api_encryption_key: "Qx1FBLKZeHq6kDBVdmh1/N94LJoyvFhYr4YqX4I8vPc="
          ota_password: "testpassword"
          EOF

      - name: Build against this checkout
        run: |
          sed -E 's#source: github://DAB-LABS/esphome-ld2411s.*#source: components#' example.yaml > ci.yaml
          grep -n 'source:' ci.yaml

      - name: Compile
        run: esphome compile ci.yaml
